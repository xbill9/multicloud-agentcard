# Copy to peers.toml and point it wherever you like.
#
#   agentcard fetch --peers-file peers.toml
#
# Naming any peer here suppresses the built-in three. Add them back with
# --builtin gcp (repeatable) if you want both.
#
# `auth` is one of: none, google-id-token, gcloud-id-token, aws-sigv4,
# aws-sigv4-local, entra-fic, gcp-wif-aws, entra-client-secret. Omit it and the
# peer falls back to <NAME>_A2A_AUTH in the environment, which is how the
# built-in three are configured.
#
# The federated modes -- google-id-token, aws-sigv4, entra-fic, gcp-wif-aws --
# each need a workload OIDC token minted at the GCE metadata server, and a
# workstation has none.
#
# Two modes exist for a workstation, and they measure something weaker:
#
#   gcloud-id-token   shells out to `gcloud auth print-identity-token`.
#                     Proves the developer has roles/run.invoker. Note that a
#                     user account cannot pin --audiences, so the token is
#                     audienced to gcloud's OAuth client id and Cloud Run
#                     accepts it by role -- never read a green row here as
#                     evidence an audience condition held.
#   aws-sigv4-local   signs with ~/.aws/credentials instead of STS web
#                     identity. Proves that identity has GetAgentCard; says
#                     nothing about the role trust policy. Not counted keyless.
#
# See "Reaching the deployed three" in README.md.

[[peer]]
name = "gcp"
endpoint = "https://research-gcp-wgcq55zbfq-uc.a.run.app"
runtime = "Cloud Run / ADK to_a2a"
auth = "google-id-token"

[[peer]]
name = "aws"
# AgentCore serves the card from the same /invocations/ path the calls use.
endpoint = "https://bedrock-agentcore.us-west-2.amazonaws.com/runtimes/<escaped-arn>/invocations/"
runtime = "Bedrock AgentCore"
auth = "aws-sigv4"

[[peer]]
name = "azure"
endpoint = "https://research-azure.<region>.azurecontainerapps.io"
runtime = "Container Apps / Agent Framework"
auth = "entra-fic"

# Anything else. A public agent needs no credential and no configuration
# beyond its URL, which is the case worth keeping easy.
#
# [[peer]]
# name = "public-demo"
# endpoint = "https://example.org/agent"
# auth = "none"
# tags = ["third-party"]
